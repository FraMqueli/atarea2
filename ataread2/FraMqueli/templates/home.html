{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - FraMqueli</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
    <!-- Incluir el navbar desde partials/navbar.html -->
    {% include 'partials/navbar.html' %}

    <!-- Contenido principal -->
    <div class="container my-5">
        <h1 class="text-center mb-4">Bienvenido la web de FraMqueli</h1>

        <!-- Grid de Proyectos -->
        <div class="row">
            {% for proj in project %}
                <div class="col-md-4">
                    <div class="card mb-4">
                        <!-- Contenedor de imagen -->
                        <div class="image-container">
                            <img src="{{ proj.image.url }}" class="card-img-top" alt="{{ proj.title }}">
                        </div>
        
                        <div class="card-body">
                            <!-- Título del proyecto -->
                            <h5 class="card-title">{{ proj.title }}</h5>
                            <!-- Descripción del proyecto -->
                            <p class="card-text">{{ proj.description }}</p>
                            <!-- Enlace (si existe) -->
                            {% if proj.url %}
                                <a href="{{ proj.url }}" class="btn btn-primary">Ver más</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        
        
        
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
